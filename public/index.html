<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FLARE · palco</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070708'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%237dffd4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/stage.css" />
  </head>
  <body class="waiting-cam">
    <canvas id="stage"></canvas>
    <div id="camGate" class="gate">
      <div class="gate-card">
        <p class="kicker">FLARE</p>
        <h1>Liga a câmara</h1>
        <p id="gateLead">Liga a câmara do PC ou lê o código QR com até 4 telemóveis.</p>
        <button type="button" id="btnGrantCam" class="gate-btn">Permitir câmara deste PC</button>
        <p class="or">Ou entra com o telemóvel na mesma rede Wi-Fi:</p>
        <img id="gateQr" alt="QR da câmara do telemóvel" />
        <a id="gateRemoteLink" href="/remote?cam=1"></a>
        <div id="gateError" class="error" hidden></div>
      </div>
    </div>
    <button type="button" id="btnExitAuto" class="exit-auto-btn" hidden title="Sair do modo AUTO (Esc)">✕</button>

    <div id="hud" hidden>
      <header class="top">
        <div class="brand">
          <span class="dot" id="liveDot"></span>
          <strong>FLARE</strong>
          <span class="look-name" id="lookName">Afterlife 3D</span>
          <div class="bass-meter" title="Graves"><i id="bassMeter"></i></div>
          <div class="cam-badges" id="camBadges">
            <span class="cam-badge" id="badgeCamA" title="Câmara A (PC)">💻 PC <i class="indicator"></i></span>
          </div>
        </div>
        <div class="actions">
          <button type="button" id="btnAuto" class="btn-auto-rave" title="Modo Showtime Autónomo Fullscreen">⚡ AUTO</button>
          <button type="button" id="btnMotionMaskToggle" class="ghost" title="Recortar Pessoas por IA (Fundo Preto)">👤 IA CORPO</button>
          <button type="button" id="btnMic" class="ghost" title="Ligar som do microfone">🔊 Som</button>
          <button type="button" id="btnToggleDock" class="ghost active" title="Mostrar/Ocultar Painel">🎛️ Painel</button>
          <button type="button" id="btnFull" class="primary" title="Ecrã inteiro">⛶</button>
        </div>
      </header>

      <aside class="qr-panel" id="qrPanel">
        <video id="rawPreview" autoplay muted playsinline></video>
        <img id="qr" alt="QR do remoto" />
        <p>Até 4 Telemóveis (QR)</p>
        <a id="remoteLink" href="/remote?cam=1" target="_blank" rel="noreferrer"></a>
      </aside>

      <!-- PAINEL UNIFICADO E SIMPLIFICADO -->
      <footer class="dock" id="dock">
        <div class="dock-top-bar">
          <!-- 1. Escolher 2D / 3D -->
          <div class="dimension-bar" id="dimBar">
            <button type="button" class="dim-chip active" data-dim="all">🌐 2D + 3D</button>
            <button type="button" class="dim-chip" data-dim="3d">🌌 SÓ 3D</button>
            <button type="button" class="dim-chip" data-dim="2d">📺 SÓ 2D</button>
          </div>

          <!-- 2. Categorias (esconde automaticamente quando SÓ 3D está ativo) -->
          <div class="cat-bar" id="catBar"></div>

          <!-- 3. Três Sliders Essenciais -->
          <div class="quick-sliders">
            <label class="slider-inline" title="Intensidade do Efeito">
              <span>✨ Efeito</span>
              <input id="intensity" type="range" min="0" max="100" value="75" />
            </label>
            <label class="slider-inline" title="Reação aos Graves da Música">
              <span>🔊 Graves</span>
              <input id="bassAmount" type="range" min="0" max="100" value="75" />
            </label>
            <label class="slider-inline" title="Mudar Cor / Tint Neon">
              <span>🎨 Cor</span>
              <input id="hueShift" type="range" min="0" max="100" value="0" />
            </label>
          </div>

          <!-- 4. Câmaras & Telemóveis na Sessão -->
          <div class="quick-cams">
            <div class="chips" id="camModeChips">
              <button type="button" class="chip active" data-cam="auto">AUTO</button>
              <button type="button" class="chip" data-cam="a">PC</button>
              <button type="button" class="chip" data-cam="b">TEL</button>
              <button type="button" class="chip" data-cam="split">SPLIT</button>
              <select id="cameraSelect" class="chip" hidden title="Selecionar webcam do PC"></select>
            </div>
            <div class="chips" id="phoneListChips"></div>
          </div>
        </div>

        <!-- Grelha de Efeitos Visuais -->
        <div id="looks" class="looks"></div>
      </footer>
    </div>
    <div id="toast" hidden></div>
    <script type="module" src="/js/stage.js"></script>
  </body>
</html>
