<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>FLARE · comando &amp; câmara</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070708'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%237dffd4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/remote.css" />
  </head>
  <body>
    <!-- ECRÃ DE ENTRADA NA SESSÃO (MÁX. 4 PESSOAS) -->
    <div id="camGate" class="gate">
      <p class="kicker">FLARE · SESSÃO LIVE (MÁX. 4 PESSOAS)</p>
      <h1>Entrar no Palco</h1>
      <p id="gateLead">Escolhe o teu nome para controlar os visuais e transmitir a tua câmara.</p>

      <div class="session-slots-box" id="sessionSlotsBox">
        <span class="slots-header" id="sessionCountText">👥 0 / 4 lugares ocupados</span>
        <div class="session-players-list" id="sessionPlayersList"></div>
      </div>

      <div class="name-input-wrap" id="nameInputWrap">
        <label for="playerNameInput">👤 O TEU NOME</label>
        <input
          id="playerNameInput"
          type="text"
          maxlength="18"
          placeholder="Ex: João, Rita, Pista..."
          autocomplete="nickname"
        />
      </div>

      <button type="button" id="btnGrantCam" class="xl">Entrar &amp; Ligar Câmara</button>
      <div id="gateError" class="error" hidden></div>
    </div>

    <!-- APP PRINCIPAL SIMPLIFICADA -->
    <div id="app" hidden>
      <!-- TOPO COMPACTO -->
      <header>
        <div class="brand">
          <span class="dot on" id="dot"></span>
          <strong>FLARE</strong>
          <span class="user-badge" id="userBadge">👤 —</span>
          <span id="status">ligado</span>
        </div>
        <div class="header-actions">
          <button type="button" id="btnMotionMaskToggle" class="chip" title="Isolar Pessoas por IA">👤 IA CORPO</button>
          <button type="button" id="btnAuto" class="btn-auto-rave" title="Modo Autónomo">⚡ AUTO</button>
        </div>
      </header>

      <!-- BARRA COMPACTA DA CÂMARA + AÇÕES RÁPIDAS -->
      <div class="cam-strip">
        <video id="preview" autoplay muted playsinline></video>
        <div class="cam-strip-controls">
          <div class="chips-scroll" id="camModeChips">
            <button type="button" class="chip active" data-cam="auto">AUTO</button>
            <button type="button" class="chip" data-cam="a">PC</button>
            <button type="button" class="chip" data-cam="b">TEL</button>
            <button type="button" class="chip" data-cam="split">SPLIT</button>
          </div>
          <div class="cam-mini-btns">
            <button type="button" id="btnFlip" class="chip">🔄 Virar</button>
            <button type="button" id="btnPulse" class="chip btn-drop">💥 DROP</button>
            <button type="button" id="btnStopCam" class="chip btn-exit">✕ Sair</button>
          </div>
        </div>
      </div>

      <!-- 1. ESCOLHER EFEITOS (2D / 3D) LOGO NO TOPO -->
      <div class="dimension-bar" id="dimBar">
        <button type="button" class="dim-chip active" data-dim="all">🌐 2D + 3D</button>
        <button type="button" class="dim-chip" data-dim="3d">🌌 SÓ 3D</button>
        <button type="button" class="dim-chip" data-dim="2d">📺 SÓ 2D</button>
      </div>

      <div class="cat-bar" id="catBar"></div>
      <div id="looks" class="looks"></div>

      <!-- 2. CONTROLO RÁPIDO (3 SLIDERS ESSENCIAIS) -->
      <div class="mod-block compact-sliders">
        <label class="slider-line">
          <span>✨ Intensidade</span>
          <input id="intensity" type="range" min="0" max="100" value="75" />
        </label>
        <label class="slider-line">
          <span>🔊 Força dos Graves</span>
          <input id="bassAmount" type="range" min="0" max="100" value="75" />
        </label>
        <label class="slider-line">
          <span>🎨 Cor / Neon</span>
          <input id="hueShift" type="range" min="0" max="100" value="0" />
        </label>
      </div>
    </div>
    <script type="module" src="/js/remote.js"></script>
  </body>
</html>
